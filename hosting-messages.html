<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Messages · StayNest hosting</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#c85b3c" />

    <link rel="icon" href="assets/icons/favicon.ico" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/hosting.css" />
    <script>
      document.documentElement.classList.add("js", "guarding");
      setTimeout(
        () => document.documentElement.classList.remove("guarding"),
        3000,
      );
    </script>
  </head>
  <body data-role="host">
    <a class="skip-link" href="#main">Skip to content</a>
    <div data-component="header" data-solid></div>

    <main id="main" class="dash">
      <div class="container">
        <header class="dash__head">
          <p class="eyebrow">Hosting</p>
          <h1 class="h1">Messages</h1>
        </header>

        <div class="dash__layout">
          <div data-component="host-nav"></div>

          <div class="dash__content">
            <div class="inbox" data-inbox data-pane="list" hidden>
              <section class="inbox__list" aria-label="Conversations">
                <ul role="list" data-convos></ul>
              </section>

              <section class="thread" aria-label="Conversation">
                <div class="thread__head">
                  <button
                    class="icon-btn thread__back"
                    type="button"
                    data-back
                    aria-label="Back to conversations"
                  >
                    <svg class="icon" aria-hidden="true">
                      <use href="#i-chevron-left" />
                    </svg>
                  </button>
                  <span
                    class="avatar avatar--sm"
                    aria-hidden="true"
                    data-t-avatar
                  ></span>
                  <div>
                    <p class="thread__name" data-t-name></p>
                    <p class="thread__meta" data-t-meta></p>
                  </div>
                </div>

                <div
                  class="thread__log"
                  role="log"
                  aria-live="polite"
                  aria-label="Messages"
                  tabindex="0"
                  data-log
                ></div>

                <div class="thread__foot">
                  <form class="composer" data-composer>
                    <label class="visually-hidden" for="msg-input">Reply</label>
                    <textarea
                      class="input"
                      id="msg-input"
                      rows="1"
                      maxlength="1000"
                      placeholder="Write a reply…"
                    ></textarea>
                    <button
                      class="btn btn--primary btn--sm"
                      type="submit"
                      data-send
                      disabled
                    >
                      Send
                    </button>
                  </form>
                </div>
              </section>
            </div>

            <div class="empty" data-empty hidden>
              <span class="empty__icon" aria-hidden="true"
                ><svg class="icon" aria-hidden="true">
                  <use href="#i-calendar" /></svg
              ></span>
              <h2 class="empty__title" data-empty-title>No messages yet</h2>
              <p class="empty__text" data-empty-text>
                When a guest contacts you about one of your stays, the
                conversation appears here.
              </p>
            </div>
            <p class="visually-hidden" role="status" data-live></p>
          </div>
        </div>
      </div>
    </main>

    <div data-component="footer"></div>

    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script type="module" src="js/hosting-messages.js"></script>
    <script type="module" src="js/session.js"></script>
    <script type="module" src="js/guard.js"></script>
  </body>
</html>
