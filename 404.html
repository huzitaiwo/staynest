<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · StayNest</title>
    <meta name="robots" content="noindex" />

    <link rel="icon" href="assets/icons/favicon.ico" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/pages.css" />
  </head>
  <body>
    <div data-site-header></div>

    <main id="main" class="notfound">
      <div class="container notfound__inner">
        <p class="notfound__code" aria-hidden="true">404</p>
        <h1 class="notfound__title">This place doesn't exist</h1>
        <p class="notfound__text">
          The page you're looking for may have moved, or the link might be
          wrong. Let's get you back to somewhere lovely.
        </p>
        <div class="notfound__actions">
          <a class="btn btn--primary" href="/index.html">Back to home</a>
          <a class="btn btn--ghost" href="/search.html">Browse stays</a>
        </div>
      </div>
    </main>

    <div data-site-footer></div>

    <script src="/js/components.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/seo.js" defer></script>
  </body>
</html>
